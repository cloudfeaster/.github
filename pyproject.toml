[project]
name = "cloudfeaster-github"
version = "0.0.0"
description = "The cloudfeaster GitHub organization's profile and default community health files"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = [
    "cloudfeaster-jetstream[core,public]",
]

[tool.uv]
package = false  # not a Python package: uv only manages the dev environment
required-version = ">=0.13.5"
exclude-newer = "7 days"

[tool.uv.sources]
# Pinned to a release tag, which the jetstream-update workflow bumps.
cloudfeaster-jetstream = { git = "https://github.com/cloudfeaster/jetstream", tag = "v0.10.0" }

[tool.jetstream]
packs = ["core", "public"]

[tool.pytest.ini_options]
markers = ["integration: slow tests that run-unit-tests.sh leaves out"]

[tool.sqlfluff.core]
templater = "jinja"
sql_file_exts = ".sql,.sql.j2"
max_line_length = 256
exclude_rules = "ST06"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "upper"
