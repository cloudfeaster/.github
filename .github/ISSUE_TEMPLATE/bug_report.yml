---
name: Bug report
description: Something isn't working as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability? Please don't report it here. See [SECURITY.md](https://github.com/cloudfeaster/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. ...
        1. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you're using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, and the versions of any tools involved (e.g. Python, uv, Node).
